name: End-to-end

# The real bot against a throwaway local homeserver: run by hand, and on pull
# requests that change dependencies (SDK or crypto updates).
on:
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  homeserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
